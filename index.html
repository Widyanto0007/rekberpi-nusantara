<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekber Nusantara - Escrow Pi</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        h2 { color: #0d5c3a; }
        button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-kunci { background-color: #f1c40f; color: black; }
        .btn-resi { background-color: #3498db; color: white; }
        .btn-cair { background-color: #2ecc71; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>Rekber Nusantara</h2>
    <p>Sistem Escrow Pi Network Sederhana & Adil</p>
    <hr>
    
    <button class="btn-kunci">1. Kunci Dana (100% Pi)</button>
    
    <button class="btn-resi">2. Input Nomor Resi</button>
    
    <button class="btn-cair">3. Cairkan Dana / Klaim</button>
</div>
<script src="app.js"></script>
</body>
</html>
